name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      ConnectionStrings__DefaultConnection: ${{ secrets.INTEGRATION_DB_CONNECTION }}
      Jwt__Key: ${{ secrets.JWT_KEY }}
      Jwt__Issuer: ClinicFlow
      Jwt__Audience: ClinicFlowUsers
      Jwt__DurationInMinutes: 60
      Jwt__RefreshTokenDurationInDays: 30

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: YourStrongPassword123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore ClinicFlow.Api/ClinicFlow.Api.sln

      - name: Build
        run: dotnet build ClinicFlow.Api/ClinicFlow.Api.sln --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.28

      - name: Apply EF Core migrations
        run: >-
          dotnet ef database update
          --project ClinicFlow.Infrastructure/ClinicFlow.Infrastructure.csproj
          --startup-project ClinicFlow.Api/ClinicFlow.Api.csproj

      - name: Run unit tests
        run: dotnet test ClinicFlow.UnitTests/ClinicFlow.UnitTests.csproj --no-build

      - name: Run integration tests
        run: dotnet test ClinicFlow.IntegrationTests/ClinicFlow.IntegrationTests.csproj --no-build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/clinicflow-backend:latest
